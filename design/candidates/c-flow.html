<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>候选 C · 流线头图</title>
<link rel="stylesheet" href="tokens.css">
<script src="data.js"></script>
<script src="parts.js"></script>
<style>
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 40px; }
.top { display: flex; align-items: center; justify-content: space-between; height: 64px; }
.brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.links { display: flex; align-items: center; gap: 4px; }
.links a { height: 32px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 999px; font-size: 13.5px; color: var(--ink-3); transition: color 120ms, background-color 120ms; }
.links a:hover { color: var(--ink); }
.links a.on { color: var(--ink); font-weight: 600; background: var(--bg-sunk); }
.links .count { margin-left: 4px; font: 500 11px/1 var(--mono); color: var(--ink-4); }
.links .theme { margin-left: 10px; }

/* 头图：许多候选汇入官方核数，再分出前几名 */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 660px; gap: 24px; align-items: center; padding: 40px 0 36px; border-bottom: 1px solid var(--line); }
.hero .eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.hero .eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--accent); }
.hero h1 { font-size: 46px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
.hero h1 em { display: block; font-style: normal; color: var(--accent); }
.hero p { max-width: 460px; margin-top: 16px; font-size: 14.5px; line-height: 1.8; color: var(--ink-3); }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 30px; border-top: 1px solid var(--line-soft); }
.steps div { padding: 14px 16px 0 0; }
.steps div + div { padding-left: 16px; border-left: 1px solid var(--line-soft); }
.steps small { display: block; font-size: 12px; color: var(--ink-3); }
.steps small .mono { margin-right: 6px; color: var(--accent); }
.steps b { display: block; margin-top: 6px; font: 700 26px/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.steps b span { margin-left: 4px; font-size: 12px; font-weight: 400; color: var(--ink-4); }
.flow { width: 660px; height: 330px; overflow: visible; }
.flow .in { fill: none; stroke: var(--ink-4); stroke-width: .7; }
.flow .dash { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; }
.flow .ring { fill: none; stroke: var(--line); }
.flow .node { fill: var(--surface); stroke: var(--line-strong); }
.flow .mark { fill: var(--accent); }
.flow .out { fill: none; stroke: var(--accent); stroke-width: 1.3; opacity: .75; }
.flow .out.more { stroke-dasharray: 3 4; opacity: .5; }
.flow text { font-family: var(--sans); font-size: 13px; fill: var(--ink); }
.flow text .rk { font-family: var(--mono); font-size: 11px; font-weight: 600; }
.flow text .g { font-family: var(--mono); font-size: 12px; fill: var(--ink-3); }
.flow text.more { fill: var(--ink-4); font-size: 12px; }
.flow .cap { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; fill: var(--ink-4); }
.flow .inputs { animation: c-draw 700ms var(--ease) both; }
.flow .outputs { animation: c-draw 420ms var(--ease) both; animation-delay: var(--d, 380ms); }
@keyframes c-draw { from { clip-path: inset(-10px 100% -10px -10px); } to { clip-path: inset(-10px -40px -10px -10px); } }

/* 榜单与侧栏 */
.body { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 28px; padding: 32px 0 90px; align-items: start; }
.board { border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-card); overflow: hidden; }
.board-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line-soft); }
.board-head h2 { font-size: 17px; font-weight: 700; }
.board-head h2 span { margin-left: 8px; font-size: 12.5px; font-weight: 400; color: var(--ink-4); }
.notice-slot:not(:empty) { padding: 14px 18px 0; }
.row { display: grid; grid-template-columns: 40px 30px minmax(0, 1fr) 132px 112px 30px; gap: 14px; align-items: center; min-height: 68px; padding: 10px 14px 10px 18px; cursor: pointer; transition: background-color 120ms; }
.row + .row { border-top: 1px solid var(--line-soft); }
.row:hover { background: var(--accent-softer); }
.row .rk { font: 600 15px/1 var(--mono); }
.row .nm { min-width: 0; }
.row .nm b { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
.row .nm b span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm b i { font-style: normal; font-weight: 400; color: var(--ink-4); }
.row .nm p { margin-top: 3px; font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .gv { text-align: right; }
.row .gv b { display: block; font: 650 17px/1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.row .gv small { display: block; margin-top: 5px; font: 11.5px/1 var(--mono); color: var(--ink-4); }
.row.in .spark { animation: gc-reveal 300ms var(--ease) both; animation-delay: calc(var(--i) * 18ms); }
.row.in .gv { animation: gc-fade-up 240ms var(--ease) both; animation-delay: calc(var(--i) * 18ms); }
.sk { display: flex; gap: 14px; align-items: center; min-height: 68px; padding: 0 18px; border-top: 1px solid var(--line-soft); }
.sk .skeleton { height: 12px; }
.none { padding: 48px 0; text-align: center; font-size: 13px; color: var(--ink-4); }

.aside { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 16px; }
.panel { padding: 16px; border-radius: var(--r-card); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-card); }
.panel h3 { margin-bottom: 10px; font: 500 10.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); }
.catlist { display: flex; flex-direction: column; gap: 1px; margin: 0 -6px; }
.catlist button { display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 10px; border-radius: var(--r-control); font-size: 13px; color: var(--ink-3); transition: color 120ms, background-color 120ms; }
.catlist button:hover { color: var(--ink); background: var(--bg-sunk); }
.catlist button.on { color: var(--accent); font-weight: 600; background: var(--accent-soft); }
.catlist .mono { font-size: 11.5px; color: var(--ink-4); }
.catlist button.on .mono { color: var(--accent); }
.catlist button:disabled { opacity: .45; cursor: default; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; font-size: 12.5px; color: var(--ink-3); }
.facts b { text-align: right; font: 500 12px/1.5 var(--mono); color: var(--ink-2); }

/* 项目详情：居中弹窗 */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); animation: gc-fade-in 200ms ease-out both; }
.modal { position: fixed; left: 50%; top: 50%; z-index: 41; width: 760px; max-height: calc(100vh - 64px); overflow: auto; padding: 26px 32px 36px; border-radius: var(--r-sheet); background: var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow-pop); transform: translate(-50%, -50%); animation: c-pop 260ms var(--ease) both; }
.modal .x { position: absolute; top: 16px; right: 16px; }
.closing .scrim { animation: gc-fade-out 160ms ease-in both; }
.closing .modal { animation: c-pop-out 180ms ease-in both; }
@keyframes c-pop { from { opacity: 0; transform: translate(-50%, -48%) scale(.96); } }
@keyframes c-pop-out { to { opacity: 0; transform: translate(-50%, -49%) scale(.98); } }

.page-h { padding: 40px 0 20px; }
.page-h h1 { font-size: 30px; font-weight: 700; }
.page-h p { margin-top: 6px; font-size: 13.5px; color: var(--ink-3); }
.empty { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 90px 0; border: 1px dashed var(--line-strong); border-radius: var(--r-card); color: var(--ink-3); font-size: 14px; }
.empty .ring { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--bg-sunk); color: var(--ink-4); }
.soon { padding: 10px 0 80px; color: var(--ink-4); font-size: 13.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand" id="brand"></div><nav class="links" id="links"></nav></header>
  <main id="main"></main>
</div>
<div id="layer"></div>
<script>
const G = window.GC;
const { icon, fmt, short, spark, series, ranking, WINDOWS, SPAN, CATS, meta, favBtn, split, P } = G;
const S = { page: 'rank', win: 'd1', cat: null, state: 'normal', open: null };
const winLabel = () => WINDOWS.find(([k]) => k === S.win)[1];
const rankColor = (r) => `var(--rank-${r <= 3 ? r : 'rest'})`;

document.getElementById('brand').innerHTML = G.logo(22) + 'GitHub 快速中心';

function links() {
  const items = [['rank', '涨星榜'], ['other', '其他榜单'], ['daily', '日报'], ['favs', '我的收藏']];
  document.getElementById('links').innerHTML = items.map(([k, l]) => `<a href="#" data-page="${k}" class="${S.page === k ? 'on' : ''}">${l}${k === 'favs' ? `<span class="count">${G.favs.size}</span>` : ''}</a>`).join('') + G.themeSwitch();
}

// 示意图：每条细线代表一批候选（不是逐个候选），汇入官方核数后分出前三名。
let seed = 11;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 2 ** 32;
const NX = 340, NY = 160;
const inputs = Array.from({ length: 64 }, (_, i) => {
  const y = 6 + (i / 63) * 300 + (rnd() - .5) * 6;
  const d = `M0 ${y.toFixed(1)}C150 ${y.toFixed(1)} 230 ${(NY + (y - NY) * .18).toFixed(1)} ${NX - 30} ${(NY + (y - NY) * .03).toFixed(1)}`;
  const dash = rnd() < .55 ? `<path class="dash" d="${d}" stroke-dasharray="${(4 + rnd() * 10).toFixed(0)} 400" stroke-dashoffset="${(-rnd() * 220).toFixed(0)}" opacity="${(.25 + rnd() * .6).toFixed(2)}"/>` : '';
  return `<path class="in" d="${d}" opacity="${(.12 + rnd() * .35).toFixed(2)}"/>${dash}`;
}).join('');

function flowOutputs(rows) {
  const ys = [70, 140, 210];
  const lines = rows.slice(0, 3).map((r, i) => `<path class="out" d="M${NX + 30} ${NY}C${NX + 90} ${NY} ${NX + 80} ${ys[i]} ${NX + 150} ${ys[i]}"/>
    <text x="${NX + 162}" y="${ys[i] + 4.5}"><tspan class="rk" fill="${rankColor(r.rank)}">${String(r.rank).padStart(2, '0')}</tspan><tspan dx="10">${split(r.repo)[1]}</tspan><tspan class="g" dx="10">+${fmt(r.gain)}</tspan></text>`).join('');
  const more = rows.length > 3 ? `<path class="out more" d="M${NX + 30} ${NY}C${NX + 90} ${NY} ${NX + 80} 280 ${NX + 150} 280"/><text class="more" x="${NX + 162}" y="284">No.04-${String(rows.length).padStart(2, '0')} 见下方榜单</text>` : '';
  return `<g class="outputs">${lines}${more}</g>`;
}

function hero(rows) {
  return `<section class="hero">
    <div>
      <div class="eyebrow">Official · Daily</div>
      <h1>GitHub 上，<em>什么正在涨星。</em></h1>
      <p>全站公开事件里找候选，再逐个按 GitHub 官方 Star 历史核出新增数，排出前 20。每天更新一次，统计日 <span class="num">${meta.statLabel}</span>。</p>
      <div class="steps">
        <div><small><span class="mono">01</span>找候选</small><b>${fmt(meta.candidates)}<span>个</span></b></div>
        <div><small><span class="mono">02</span>官方核数</small><b>${fmt(meta.verified)}<span>个</span></b></div>
        <div><small><span class="mono">03</span>上榜</small><b>${rows.length}<span>个，含并列</span></b></div>
      </div>
    </div>
    <svg class="flow" viewBox="0 0 660 330" aria-hidden="true">
      <g class="inputs">${inputs}</g>
      <circle class="ring" cx="${NX}" cy="${NY}" r="70" opacity=".6"/><circle class="ring" cx="${NX}" cy="${NY}" r="46"/>
      <circle class="node" cx="${NX}" cy="${NY}" r="28"/>
      <path class="mark" d="M${NX} ${NY - 13}l3 10 10 3-10 3-3 10-3-10-10-3 10-3z"/>
      <g id="outs">${flowOutputs(rows)}</g>
      <text class="cap" x="0" y="326">全站候选</text><text class="cap" x="${NX}" y="326" text-anchor="middle">官方核数</text><text class="cap" x="${NX + 162}" y="326">${winLabel()}前 20</text>
    </svg>
  </section>`;
}

function rowsHtml(rows) {
  const last = SPAN[S.win];
  return rows.map((r, i) => { const [o, n] = split(r.repo); return `<div class="row in" style="--i:${i}" data-open="${r.repo}">
    <span class="rk" style="color:${rankColor(r.rank)}">${String(r.rank).padStart(2, '0')}</span>${G.avatar(r.repo, 28)}
    <div class="nm"><b><span><i>${o} / </i>${n}</span>${r.tie ? '<span class="tag tie">并列</span>' : ''}</b><p>${r.what}</p></div>
    ${spark(series(r.repo), { w: 132, h: 30, last })}
    <div class="gv"><b>+${fmt(r.gain)}</b><small>总 ${short(r.total)}</small></div>${favBtn(r.repo)}
  </div>`; }).join('');
}

function aside() {
  const all = ranking(S.win);
  const n = (c) => ranking(S.win, c).length;
  return `<div class="panel"><h3>分类</h3><div class="catlist">${[[null, '全部', all.length], ...CATS.map((c) => [c, c, n(c)])].map(([k, l, cnt]) => `<button data-cat="${k ?? ''}" class="${S.cat === k ? 'on' : ''}" ${cnt ? '' : 'disabled'}>${l}<span class="mono">${cnt}</span></button>`).join('')}</div></div>
    <div class="panel"><h3>今天的数据</h3><div class="facts"><span>统计日</span><b>${meta.statDay}</b><span>更新于</span><b>${meta.updatedAt}</b><span>数据来源</span><b>GitHub 官方</b><span>状态</span><b style="color:${S.state === 'failed' ? 'var(--hot)' : S.state === 'incomplete' ? 'var(--amber)' : 'var(--ok)'}">${S.state === 'failed' ? '更新失败' : S.state === 'incomplete' ? '可能不完整' : '正常'}</b></div></div>`;
}

function board() {
  const el = document.getElementById('rows');
  document.getElementById('notice').innerHTML = G.NOTICE[S.state] || '';
  document.getElementById('aside').innerHTML = aside();
  document.getElementById('bh').innerHTML = `涨星榜<span>${winLabel()} · ${S.cat ?? '全部分类'}</span>`;
  if (S.state === 'loading') { el.innerHTML = Array.from({ length: 6 }, () => `<div class="sk"><span class="skeleton" style="width:22px"></span><span class="skeleton" style="width:40%"></span><span class="skeleton" style="width:12%;margin-left:auto"></span></div>`).join(''); return; }
  const rows = ranking(S.win, S.cat);
  el.innerHTML = rows.length ? rowsHtml(rows) : `<div class="none">这个分类今天没有项目进入核数结果</div>`;
}

function favPage() {
  const keys = [...G.favs];
  const head = `<div class="page-h"><h1>我的收藏</h1><p>项目和单个 Skill 都在这里，只有你自己看得到</p></div>`;
  if (!keys.length) return head + `<div class="empty"><span class="ring">${icon('bookmark')}</span>还没有收藏<button class="btn" data-page="rank">去看涨星榜${icon('arrow')}</button></div>`;
  return head + `<div class="board">${keys.map((k, i) => { const [repo, skill] = k.split('#'); return `<div class="row" style="grid-template-columns:30px minmax(0,1fr) 140px 30px" data-open="${repo}">${G.avatar(repo, 28)}<div class="nm"><b><span>${skill ? `<i>${repo} · </i>${skill}` : repo}</span><span class="tag">${skill ? 'Skill' : '项目'}</span></b><p>${skill ? P[repo].skills.find((s) => s.name === skill).desc : P[repo].what}</p></div><span class="mono" style="font-size:12px;color:var(--ink-4);text-align:right">10-23 09:12</span>${favBtn(k)}</div>`; }).join('')}</div>`;
}

function render() {
  links();
  const m = document.getElementById('main');
  if (S.page === 'rank') {
    m.innerHTML = hero(ranking(S.win)) + `<div class="body"><section class="board"><div class="board-head"><h2 id="bh"></h2>${G.seg(WINDOWS, S.win, 'win')}</div><div class="notice-slot" id="notice"></div><div id="rows"></div></section><aside class="aside" id="aside"></aside></div>`;
    board();
  } else if (S.page === 'favs') m.innerHTML = favPage();
  else m.innerHTML = `<div class="page-h"><h1>${S.page === 'other' ? '其他榜单' : '日报'}</h1></div><p class="soon">候选阶段只演示涨星榜、项目页和收藏；选定方向后在高保真阶段补齐这一页。</p>`;
}

function openModal(repo) {
  S.open = repo;
  const layer = document.getElementById('layer');
  layer.className = '';
  layer.innerHTML = `<div class="scrim" data-close></div><div class="modal" role="dialog" aria-label="${repo}"><button class="icon-btn x" data-close aria-label="关闭">${icon('close')}</button>${G.detail(repo, { win: S.win, state: S.state })}</div>`;
}
function closeModal() {
  const layer = document.getElementById('layer');
  if (!S.open) return;
  S.open = null;
  if (G.reduced()) { layer.innerHTML = ''; return; }
  layer.className = 'closing';
  setTimeout(() => { if (!S.open) layer.innerHTML = ''; }, 180);
}
G.bindDetail(document.getElementById('layer'));

document.addEventListener('click', (e) => {
  const p = e.target.closest('[data-page]');
  if (p) { e.preventDefault(); S.page = p.dataset.page; render(); return; }
  const w = e.target.closest('[data-win]');
  if (w) {
    S.win = w.dataset.win;
    G.setSeg(w.closest('.seg'), 'win', S.win);
    document.getElementById('outs').innerHTML = flowOutputs(ranking(S.win)).replace('class="outputs"', 'class="outputs" style="--d:0ms"');
    document.querySelectorAll('.flow .cap')[2].textContent = winLabel() + '前 20';
    board();
    return;
  }
  const c = e.target.closest('[data-cat]');
  if (c) { S.cat = c.dataset.cat || null; board(); return; }
  if (e.target.closest('[data-close]')) { closeModal(); return; }
  const o = e.target.closest('[data-open]');
  if (o) openModal(o.dataset.open);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('gc:fav', () => { links(); if (S.page === 'favs') document.getElementById('main').innerHTML = favPage(); });
G.demoPanel((st) => { S.state = st; if (S.page === 'rank') board(); if (S.open) openModal(S.open); });
// 评审用网址参数：?win=d7&state=failed&open=owner/repo
const Q = new URLSearchParams(location.search);
if (Q.get('win')) S.win = Q.get('win');
if (Q.get('state')) S.state = Q.get('state');
render();
if (Q.get('open')) openModal(Q.get('open'));
</script>
</body>
</html>
