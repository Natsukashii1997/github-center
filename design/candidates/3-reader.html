<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>涨星榜 · GitHub 快速中心（v3 三 · 导读）</title>
<style>
:root {
  --bg: #EFF1F2; --surface: #FFFFFF; --sunk: #E5E8EA; --sel: #FFFFFF;
  --ink: #15181B; --ink-2: #3C4146; --ink-3: #697077; --ink-4: #9AA1A7;
  --line: #DEE2E5; --line-2: #CDD2D6;
  --accent: #B4532A; --accent-ink: #9A4420; --accent-soft: rgb(180 83 42 / .08); --bar: #D3D8DC;
  --warn: #9C6A1A; --bad: #B4432F; --ok: #3F7A5A;
  --shadow: 0 1px 2px rgb(20 30 40 / .05), 0 8px 24px -12px rgb(20 30 40 / .12);
  --font-ui: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  --font-read: "Songti SC", "STSong", serif;
  --font-num: "Iowan Old Style", "New York", Georgia, serif;
  --font-code: "SF Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.25, 1, .5, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #111417; --surface: #181C20; --sunk: #1F2428; --sel: #1B1F23;
  --ink: #E9ECEE; --ink-2: #C5CBD0; --ink-3: #8F979E; --ink-4: #646C73;
  --line: rgb(255 255 255 / .07); --line-2: rgb(255 255 255 / .12);
  --accent: #E8865A; --accent-ink: #F09D76; --accent-soft: rgb(232 134 90 / .10); --bar: #2D3338;
  --warn: #D7A453; --bad: #E07A63; --ok: #7CC29A;
  --shadow: 0 0 0 1px rgb(255 255 255 / .06);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111417; --surface: #181C20; --sunk: #1F2428; --sel: #1B1F23;
    --ink: #E9ECEE; --ink-2: #C5CBD0; --ink-3: #8F979E; --ink-4: #646C73;
    --line: rgb(255 255 255 / .07); --line-2: rgb(255 255 255 / .12);
    --accent: #E8865A; --accent-ink: #F09D76; --accent-soft: rgb(232 134 90 / .10); --bar: #2D3338;
    --warn: #D7A453; --bad: #E07A63; --ok: #7CC29A;
    --shadow: 0 0 0 1px rgb(255 255 255 / .06);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-width: 1280px; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-ui); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--font-num); font-variant-numeric: lining-nums tabular-nums; }

/* 顶栏 */
.top { position: sticky; top: 0; z-index: 20; height: 56px; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1360px; height: 100%; margin: 0 auto; padding: 0 40px; display: flex; align-items: center; gap: 36px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.mark { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; }
.mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--bg); transform: translate(3px, -3px); }
.nav { display: flex; gap: 26px; }
.nav a { position: relative; height: 56px; display: flex; align-items: center; color: var(--ink-3); transition: color .14s; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current] { color: var(--ink); font-weight: 500; }
.nav a[aria-current]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 18px; font-size: 13px; color: var(--ink-3); }
.fresh { display: flex; align-items: center; gap: 8px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.dot[data-tone="warn"] { background: var(--warn); }
.dot[data-tone="bad"] { background: var(--bad); }
.who { display: flex; gap: 12px; padding-left: 18px; border-left: 1px solid var(--line); }
.who b { color: var(--ink-2); font-weight: 500; }
.who a:hover { color: var(--ink); }

/* 两栏 */
.page { max-width: 1360px; margin: 0 auto; padding: 0 40px; display: grid; grid-template-columns: 520px minmax(0, 1fr); gap: 40px; }
.index { padding: 32px 0 64px; min-width: 0; }
h1 { margin: 0; font-family: var(--font-read); font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: .02em; }
.lede { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-3); }
.lede .num { color: var(--ink-2); font-size: 13.5px; }
.wins { position: relative; display: flex; gap: 0; margin-top: 22px; border-bottom: 1px solid var(--line); }
.wins button { width: 96px; height: 38px; border: 0; background: none; color: var(--ink-3); cursor: pointer; transition: color .14s; }
.wins button:hover { color: var(--ink); }
.wins button[aria-pressed="true"] { color: var(--ink); font-weight: 500; }
.wins-line { position: absolute; left: 0; bottom: -1px; width: 96px; height: 2px; background: var(--accent); transition: transform .26s var(--ease); }
.cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.cats button { height: 26px; padding: 0 10px; border: 0; border-radius: 999px; background: none; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-3); font-size: 12px; cursor: pointer; transition: color .14s, background-color .14s, box-shadow .14s; }
.cats button:hover { color: var(--ink); }
.cats button[aria-pressed="true"] { color: var(--bg); background: var(--ink); box-shadow: none; }
.note { display: none; margin-top: 14px; padding: 9px 12px; border-radius: 8px; font-size: 12.5px; color: var(--ink-2); background: var(--sunk); }
.note.on { display: flex; gap: 8px; align-items: baseline; }
.note b { font-weight: 500; flex: none; }
.note[data-tone="warn"] b { color: var(--warn); }
.note[data-tone="bad"] b { color: var(--bad); }

.list-wrap { position: relative; margin-top: 16px; }
.sel-mark { position: absolute; left: 0; top: 0; right: 0; height: 64px; border-radius: 10px; background: var(--sel); box-shadow: var(--shadow); transition: transform .24s var(--ease); pointer-events: none; }
ol.rows { position: relative; list-style: none; margin: 0; padding: 0; }
.row { height: 64px; display: grid; grid-template-columns: 36px 28px minmax(0, 1fr) auto; column-gap: 12px; align-items: center; padding: 0 16px 0 12px; border-radius: 10px; cursor: pointer; }
.row:not([aria-selected="true"]):hover .nm { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.rk { font-family: var(--font-num); font-variant-numeric: lining-nums tabular-nums; font-size: 18px; color: var(--ink-4); text-align: right; }
.row[data-top] .rk { color: var(--ink-2); }
.row[aria-selected="true"] .rk { color: var(--accent); }
.tie { display: block; font-family: var(--font-ui); font-size: 10px; color: var(--warn); text-align: right; margin-top: -2px; }
.tie[hidden] { display: none; }
.av { width: 28px; height: 28px; border-radius: 50%; background: var(--sunk); object-fit: cover; box-shadow: 0 0 0 1px var(--line); }
.av-fallback { display: grid; place-items: center; font-size: 12px; color: var(--ink-3); }
.who-t { min-width: 0; }
.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.nm .o { color: var(--ink-3); }
.nm .n { font-weight: 600; }
.ds { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }
.g { font-family: var(--font-num); font-variant-numeric: lining-nums tabular-nums; font-size: 16px; color: var(--ink); text-align: right; }
.g small { font-size: 12px; color: var(--ink-4); margin-right: 1px; }

/* 阅读卡 */
.reader { position: sticky; top: 56px; align-self: start; height: calc(100vh - 56px); padding: 32px 0 24px; }
.card { height: 100%; display: flex; flex-direction: column; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.body { flex: 1; min-height: 0; overflow: auto; padding: 34px 44px 28px; scrollbar-width: thin; }
.dock { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 44px; border-top: 1px solid var(--line); }
.dock .k { font-size: 12px; color: var(--ink-3); margin-right: 2px; }
.eyebrow { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-3); }
.eyebrow .num { color: var(--accent-ink); font-size: 14px; }
.title { display: flex; align-items: center; gap: 16px; margin-top: 14px; }
.title .av { width: 48px; height: 48px; }
.title h2 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -.005em; overflow-wrap: anywhere; }
.title h2 .o { color: var(--ink-3); font-weight: 400; }
.meta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 4px; font-size: 12.5px; color: var(--ink-3); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 26px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 14px 0 14px 16px; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; padding-left: 0; }
.stat .k { font-size: 12px; color: var(--ink-3); }
.stat .v { display: block; margin-top: 2px; font-family: var(--font-num); font-variant-numeric: lining-nums tabular-nums; font-size: 22px; color: var(--ink-2); }
.stat[data-on] .k { color: var(--accent-ink); }
.stat[data-on] .v { color: var(--ink); }
.chart { margin-top: 22px; }
.chart-k { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); }
.chart-k .num { font-size: 12.5px; }
.cbars { position: relative; display: flex; align-items: flex-end; gap: 4px; height: 76px; margin-top: 10px; box-shadow: inset 0 -1px 0 var(--line-2); }
.cbars i { flex: 1; height: var(--h); min-height: var(--m); border-radius: 2px 2px 0 0; background: var(--bar); transform-origin: bottom; transition: background-color .16s; }
.cbars i.in { background: var(--accent); }
.cdates { display: flex; justify-content: space-between; margin-top: 6px; font-family: var(--font-num); font-size: 12px; color: var(--ink-4); }
.read { margin-top: 26px; display: grid; gap: 18px; }
.read .k { font-size: 12px; color: var(--ink-3); letter-spacing: .04em; }
.read p { margin: 4px 0 0; font-family: var(--font-read); font-size: 19px; line-height: 1.65; color: var(--ink); }
.cond { margin: 22px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--sunk); font-size: 13px; color: var(--ink-2); }
.cond b { display: block; font-size: 12px; font-weight: 500; color: var(--warn); margin-bottom: 2px; }
.skills { margin-top: 22px; }
.skills .k { font-size: 12px; color: var(--ink-3); }
.skill { display: grid; grid-template-columns: 200px 1fr; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.skill code { font-family: var(--font-code); font-size: 12.5px; color: var(--ink); }
.seg { position: relative; display: inline-flex; padding: 2px; border-radius: 8px; background: var(--sunk); }
.seg button { position: relative; z-index: 1; width: 104px; height: 28px; border: 0; background: none; border-radius: 6px; font-size: 12.5px; color: var(--ink-3); cursor: pointer; transition: color .14s; }
.seg button[aria-pressed="true"] { color: var(--ink); font-weight: 500; }
.seg-thumb { position: absolute; top: 2px; left: 2px; width: 104px; height: 28px; border-radius: 6px; background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .08); transition: transform .24s var(--ease); }
.btn { height: 36px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; border: 0; border-radius: 8px; font-size: 13px; cursor: pointer; transition: background-color .14s, color .14s, box-shadow .14s; }
.btn svg { width: 16px; height: 16px; }
.btn-p { background: var(--ink); color: var(--bg); }
.btn-p:hover { background: var(--ink-2); }
.btn-p[data-done] { background: var(--ok); color: #fff; }
.btn-g { background: none; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn-g:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink-4); }
.btn-g[aria-pressed="true"] { color: var(--accent-ink); box-shadow: inset 0 0 0 1px var(--accent); }
.btn-g[aria-pressed="true"] path { fill: currentColor; }
.hint { margin-top: 22px; font-size: 12px; color: var(--ink-4); }
.dock .sp { flex: 1; }
.hint kbd { font: 11px var(--font-code); padding: 1px 5px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-3); }
.card > .empty, .card > .sk-wrap { padding: 34px 44px; }
.empty { padding: 56px 0; text-align: center; color: var(--ink-3); }
.empty b { display: block; margin-bottom: 6px; color: var(--ink); font-weight: 500; font-size: 15px; }
.foot { margin-top: 20px; font-size: 12px; color: var(--ink-4); }
.sk { display: block; height: 10px; border-radius: 5px; background: var(--sunk); animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#"><span class="mark" aria-hidden="true"></span>GitHub 快速中心</a>
    <nav class="nav" aria-label="主导航"><a href="#" aria-current="page">涨星榜</a><a href="#">其他榜单</a><a href="#">日报</a><a href="#">我的收藏</a></nav>
    <div class="top-r">
      <span class="fresh"><span class="dot" id="dot"></span><span id="fresh"></span></span>
      <span class="who"><b>常浩</b><a href="#">退出</a></span>
    </div>
  </div>
</header>

<div class="page">
  <section class="index">
    <h1>涨星榜</h1>
    <p class="lede" id="lede"></p>
    <div class="wins" id="wins" role="group" aria-label="时间窗口"><span class="wins-line" id="winline"></span></div>
    <div class="cats" id="cats" role="group" aria-label="分类"></div>
    <div class="note" id="note"></div>
    <div class="list-wrap">
      <span class="sel-mark" id="selmark"></span>
      <ol class="rows" id="rows" role="listbox" aria-label="榜单"></ol>
    </div>
    <p class="foot">所有数字来自 GitHub 官方数据。中文简介为示例文案。<span class="num">v3 · 三 · 导读</span></p>
  </section>
  <aside class="reader"><article class="card" id="card" aria-live="polite"></article></aside>
</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const STAR = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.6l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L2.8 7.9l5-.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  const COPY = '<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6.5" y="6.5" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M13.5 4.5v-.5a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 4v7A1.5 1.5 0 0 0 5 12.5h.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
  const OUT = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4.5H5A1.5 1.5 0 0 0 3.5 6v9A1.5 1.5 0 0 0 5 16.5h9a1.5 1.5 0 0 0 1.5-1.5v-3M11.5 3.5h5v5M16.5 3.5L9 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const CHECK = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let win = 'd1', cat = null, state = 'ok', sel = null, target = 'claude', rows = [];
  const q = new URLSearchParams(location.search);
  if (q.get('win')) win = q.get('win');
  if (q.get('cat')) cat = q.get('cat');
  if (q.get('sel')) sel = q.get('sel');

  const wins = $('#wins'), winline = $('#winline');
  GC.WINDOWS.forEach((w, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = w.label; b.dataset.win = w.id;
    b.addEventListener('click', () => { if (win !== w.id) { win = w.id; render(); } });
    wins.appendChild(b);
  });
  const cats = $('#cats');
  [null, ...GC.CATS].forEach((c) => {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.cat = c || ''; b.textContent = c || '全部';
    b.addEventListener('click', () => { if (cat !== c) { cat = c; render(); } });
    cats.appendChild(b);
  });

  function installText(repo, t) {
    return `请在你所在的这台电脑上，为 ${GC.AI[t]} 安装 GitHub 项目 ${repo}（https://github.com/${repo}）。1. 先阅读项目官方 README 和安装文档，按文档步骤安装和配置，不要猜测命令。2. 装好后实际调用一次，确认能正常使用。3. 如果需要账号、API Key 或付费，停下来告诉我缺什么，不要自行注册或付费。4. 最后用两三句话告诉我：它装在哪里、怎么调用、第一次可以怎么试。`;
  }

  function create(r) {
    const li = document.createElement('li');
    li.className = 'row';
    li.setAttribute('role', 'option');
    li.innerHTML = `<div><div class="rk"></div><span class="tie" hidden>并列</span></div>
      <img class="av" alt="" loading="lazy" referrerpolicy="no-referrer" src="${GC.avatar(r, 56)}">
      <div class="who-t"><div class="nm"><span class="o">${GC.ownerOf(r)}/</span><span class="n">${GC.nameOf(r)}</span></div><div class="ds">${r.what}</div></div>
      <div class="g"><small>+</small><span class="gv"></span></div>`;
    li.querySelector('.av').addEventListener('error', (e) => { const d = document.createElement('span'); d.className = 'av av-fallback'; d.textContent = r.repo[0].toUpperCase(); e.target.replaceWith(d); });
    li.addEventListener('click', () => select(r.repo));
    return li;
  }
  function update(li, r) {
    li.querySelector('.rk').textContent = r.rank;
    li.querySelector('.tie').hidden = !r.tie;
    li.toggleAttribute('data-top', r.rank <= 3);
    GC.swap(li.querySelector('.gv'), GC.num(r.gain));
  }

  const card = $('#card'), selmark = $('#selmark'), rowsEl = $('#rows');
  function placeMark() {
    const li = rowsEl.querySelector(`[data-key="${CSS.escape(sel || '')}"]`);
    rowsEl.querySelectorAll('.row').forEach((x) => x.setAttribute('aria-selected', x === li));
    selmark.style.visibility = li ? '' : 'hidden';
    if (li) selmark.style.transform = `translateY(${li.offsetTop}px)`;
  }

  function cardHTML(r) {
    const span = GC.SPAN[win], max = Math.max(...r.series, 1), W = GC.WINDOWS.find((w) => w.id === win);
    const g = (n) => r.series.slice(-n).reduce((s, x) => s + x, 0);
    return `<div class="body">
      <div class="eyebrow"><span>第 ${r.rank} 名${r.tie ? '（并列）' : ''} · ${W.label}</span><span class="num">+${GC.num(r.gain)}</span></div>
      <div class="title"><img class="av" alt="" referrerpolicy="no-referrer" src="${GC.avatar(r, 96)}"><div><h2><span class="o">${GC.ownerOf(r)}/</span>${GC.nameOf(r)}</h2>
        <div class="meta">${r.cats.map((c) => `<span>${c}</span>`).join('')}${r.lang ? `<span>${r.lang}</span>` : ''}</div></div></div>
      <div class="stats">
        ${GC.WINDOWS.map((w) => `<div class="stat"${w.id === win ? ' data-on' : ''}><span class="k">${w.label}新增</span><span class="v">+${GC.num(g(w.days))}</span></div>`).join('')}
        <div class="stat"><span class="k">总 Star</span><span class="v">${GC.wan(r.total)}</span></div>
      </div>
      <div class="chart">
        <div class="chart-k"><span>近 30 天每日新增</span><span>最高一天 <span class="num">${GC.num(max)}</span></span></div>
        <div class="cbars">${r.series.map((v, i) => `<i class="${i >= 30 - span ? 'in' : ''}" style="--h:${(v / max) * 100}%;--m:${v > 0 ? 1 : 0}px" title="${GC.md(GC.dayAt(i))}：${GC.num(v)}"></i>`).join('')}</div>
        <div class="cdates"><span>${GC.mdShort(GC.dayAt(0))}</span><span>${GC.mdShort(GC.dayAt(15))}</span><span>${GC.mdShort(GC.dayAt(29))}</span></div>
      </div>
      <div class="read">
        <div><div class="k">它是做什么的</div><p>${r.what}。</p></div>
        <div><div class="k">解决什么问题</div><p>${r.problem}。</p></div>
      </div>
      ${r.conditions.length ? `<div class="cond"><b>使用条件</b>${r.conditions.join('；')}</div>` : ''}
      ${r.skills.length ? `<div class="skills"><div class="k">包含的 Skill</div>${r.skills.map((s) => `<div class="skill"><code>${s.name}</code><span>${s.desc}</span></div>`).join('')}</div>` : ''}
      <p class="hint"><kbd>↑</kbd> <kbd>↓</kbd> 在榜单里上下切换项目</p>
      </div>
      <div class="dock">
        <span class="k">安装到</span>
        <div class="seg" role="group" aria-label="目标 AI"><span class="seg-thumb"></span>${Object.entries(GC.AI).map(([k, v]) => `<button type="button" data-t="${k}" aria-pressed="${k === target}">${v}</button>`).join('')}</div>
        <button class="btn btn-p" type="button" data-act="copy" title="${installText(r.repo, target)}">${COPY}<span>复制安装指令</span></button>
        <span class="sp"></span>
        <button class="btn btn-g" type="button" data-act="fav" aria-pressed="${GC.favs.has(r.repo)}">${STAR}<span>${GC.favs.has(r.repo) ? '已收藏' : '收藏'}</span></button>
        <a class="btn btn-g" href="https://github.com/${r.repo}" target="_blank" rel="noopener">${OUT}<span>GitHub</span></a>
      </div>`;
  }

  function wireCard(r) {
    const seg = $('.seg', card), thumb = $('.seg-thumb', card);
    const place = () => { thumb.style.transform = `translateX(${target === 'claude' ? 0 : 104}px)`; };
    place();
    seg.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      target = b.dataset.t; place();
      seg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
      $('[data-act="copy"]', card).title = installText(r.repo, target);
    }));
    const copy = $('[data-act="copy"]', card);
    copy.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(installText(r.repo, target)); } catch { /* 候选页里复制失败也照常演示 */ }
      copy.dataset.done = ''; copy.innerHTML = `${CHECK}<span>已复制</span>`;
      if (!GC.reduced()) copy.firstElementChild.animate([{ transform: 'scale(.6)' }, { transform: 'scale(1.05)' }, { transform: 'scale(1)' }], { duration: 260, easing: GC.EASE });
      GC.toast(`已复制给 ${GC.AI[target]} 的安装指令`);
      setTimeout(() => { delete copy.dataset.done; copy.innerHTML = `${COPY}<span>复制安装指令</span>`; }, 2000);
    });
    const fav = $('[data-act="fav"]', card);
    fav.addEventListener('click', () => { GC.toggleFav(r.repo, fav); fav.lastElementChild.textContent = GC.favs.has(r.repo) ? '已收藏' : '收藏'; });
  }

  // 同一个项目换窗口时只更新名次、高亮的统计和曲线里的窗口段；换项目时正文淡入上移。
  function refreshCard(r) {
    const W = GC.WINDOWS.find((w) => w.id === win), from = 30 - GC.SPAN[win];
    if (!$('.eyebrow', card)) return;
    $('.eyebrow', card).innerHTML = `<span>第 ${r.rank} 名${r.tie ? '（并列）' : ''} · ${W.label}</span><span class="num">+${GC.num(r.gain)}</span>`;
    card.querySelectorAll('.stat').forEach((x, i) => x.toggleAttribute('data-on', GC.WINDOWS[i]?.id === win));
    card.querySelectorAll('.cbars i').forEach((b, k) => {
      const on = k >= from;
      b.style.transitionDelay = on !== b.classList.contains('in') ? `${(29 - k) * 9}ms` : '0ms';
      b.classList.toggle('in', on);
    });
  }
  let shown = null;
  function showCard() {
    const r = rows.find((x) => x.repo === sel);
    if (!r) { card.innerHTML = `<div class="empty"><b>这个分类当期没有核出项目</b>换个时间窗口，或者看看别的分类。</div>`; shown = null; return; }
    if (shown === r.repo) { refreshCard(r); return; }
    const paint = () => {
      card.innerHTML = cardHTML(r);
      wireCard(r);
      if (GC.reduced()) return;
      $('.body', card).animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: GC.EASE });
      card.querySelectorAll('.cbars i').forEach((b, k) => b.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 260, delay: 60 + k * 6, easing: GC.EASE, fill: 'backwards' }));
    };
    paint();
    shown = r.repo;
  }

  function select(repo) {
    if (sel === repo) return;
    sel = repo; placeMark(); showCard();
  }

  addEventListener('keydown', (e) => {
    if (!['ArrowDown', 'ArrowUp'].includes(e.key) || !rows.length) return;
    e.preventDefault();
    const i = rows.findIndex((r) => r.repo === sel);
    const n = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    select(n.repo);
    rowsEl.querySelector(`[data-key="${CSS.escape(n.repo)}"]`).scrollIntoView({ block: 'nearest' });
  });

  function render() {
    const Wn = GC.WINDOWS.find((w) => w.id === win);
    wins.querySelectorAll('button').forEach((b, i) => { b.setAttribute('aria-pressed', b.dataset.win === win); if (b.dataset.win === win) winline.style.transform = `translateX(${i * 96}px)`; });
    cats.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', (b.dataset.cat || null) === cat));
    const st = GC.STATUS[state === 'loading' ? 'ok' : state];
    $('#dot').dataset.tone = st.tone;
    $('#fresh').textContent = state === 'failed' ? '更新失败 · 显示 10 月 22 日数据' : state === 'partial' ? '可能不完整 · 10 月 22 日数据' : `10 月 22 日数据 · ${GC.hm(GC.updated)} 更新`;
    $('#lede').innerHTML = `统计日 ${GC.md(GC.dayAt(29))}（UTC）。全站 <span class="num">${GC.meta.candidates}</span> 个候选，官方核数 <span class="num">${GC.meta.checks}</span> 次。`;

    rows = GC.ranking(win, cat);
    const note = $('#note');
    if (state === 'partial' || state === 'failed') { note.className = 'note on'; note.dataset.tone = st.tone; note.innerHTML = `<b>${st.short}</b><span>${st.long}</span>`; }
    else if (rows.length && rows.length < 20) { note.className = 'note on'; note.dataset.tone = ''; note.innerHTML = `<b>不足 20 个</b><span>「${cat}」在${Wn.label}只核出 ${rows.length} 个，全部列出。</span>`; }
    else note.className = 'note';

    if (state === 'loading') {
      rowsEl.innerHTML = Array.from({ length: 8 }, () => `<li class="row"><span class="sk" style="width:16px;justify-self:end"></span><span class="av"></span><div><span class="sk" style="width:46%"></span><span class="sk" style="width:80%;margin-top:9px"></span></div><span class="sk" style="width:44px"></span></li>`).join('');
      selmark.style.visibility = 'hidden';
      card.innerHTML = `<div class="sk-wrap"><span class="sk" style="width:30%"></span><span class="sk" style="width:60%;height:22px;margin-top:20px"></span><span class="sk" style="width:100%;height:60px;margin-top:28px"></span><span class="sk" style="width:100%;height:76px;margin-top:22px"></span><span class="sk" style="width:90%;margin-top:28px"></span><span class="sk" style="width:70%;margin-top:12px"></span></div>`;
      shown = null;
      return;
    }
    if (rowsEl.querySelector('.row:not([data-key])')) rowsEl.innerHTML = '';
    if (!rows.some((r) => r.repo === sel)) sel = rows[0]?.repo || null;
    GC.reconcile(rowsEl, rows, { key: (r) => r.repo, create, update, stagger: 16 });
    placeMark();
    showCard();
  }

  render();
  GC.demo((s) => { state = s; render(); });
})();
</script>
</body>
</html>
