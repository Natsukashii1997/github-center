<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>候选 B · 单栏阅读</title>
<link rel="stylesheet" href="tokens.css">
<script src="data.js"></script>
<script src="parts.js"></script>
<style>
/* 顶栏 */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in oklab, var(--bg) 86%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-soft); }
.top-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 60px; max-width: 1120px; margin: 0 auto; padding: 0 32px; }
.brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.links { display: flex; gap: 30px; }
.links a { position: relative; padding: 19px 0; font-size: 13.5px; color: var(--ink-3); transition: color 120ms; }
.links a:hover { color: var(--ink); }
.links a.on { color: var(--ink); font-weight: 600; }
.links a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); transform: scaleX(0); transition: transform 240ms var(--ease); }
.links a.on::after { transform: scaleX(1); }
.links .count { margin-left: 4px; font: 500 11px/1 var(--mono); color: var(--ink-4); }
.tools { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
.tools .stamp { font: 11.5px/1.4 var(--mono); color: var(--ink-4); text-align: right; }

/* 正文列 */
.col { max-width: 920px; margin: 0 auto; padding: 56px 32px 96px; }
.eyebrow { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
.eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--accent); }
.hero h1 { font-size: 44px; line-height: 1.22; font-weight: 700; letter-spacing: -.02em; }
.hero h1 em { display: block; font-style: normal; color: var(--accent); }
.hero h1 .w { display: inline-block; }
.hero p { max-width: 620px; margin-top: 16px; font-size: 14.5px; line-height: 1.8; color: var(--ink-3); }
.hero p .mono { color: var(--ink-2); }
.controls { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 36px 0 14px; }
.cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 26px; }
.notice-slot:not(:empty) { margin-bottom: 18px; }
.cat-note { margin-bottom: 14px; font-size: 12.5px; color: var(--ink-4); }

/* 榜单：只用细线分隔 */
.thead, .row { display: grid; grid-template-columns: 52px minmax(0, 1fr) 190px 120px 92px 30px; gap: 16px; align-items: center; }
.thead { padding: 0 0 10px; border-bottom: 1px solid var(--line); font: 500 11px/1 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-4); }
.thead .r, .row .g, .row .t { text-align: right; }
.row { position: relative; min-height: 76px; padding: 14px 0; border-bottom: 1px solid var(--line-soft); cursor: pointer; background: var(--bg); }
.row .rk { font: 600 20px/1 var(--mono); letter-spacing: -.02em; }
.row .nm { min-width: 0; }
.row .nm b { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; transition: color 120ms; }
.row .nm b span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm b i { font-style: normal; font-weight: 400; color: var(--ink-4); }
.row:hover .nm b span { color: var(--accent); }
.row .nm p { margin-top: 4px; font-size: 13px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .cs { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.row .g { font: 650 19px/1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.row .t { font: 12px/1 var(--mono); color: var(--ink-4); }
.foot-note { margin-top: 22px; font-size: 12px; color: var(--ink-4); }
.sk { display: flex; gap: 16px; align-items: center; min-height: 76px; border-bottom: 1px solid var(--line-soft); }
.sk .skeleton { height: 12px; }

/* 项目页（整页） */
.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 28px; font-size: 13px; color: var(--ink-3); transition: color 120ms; }
.back:hover { color: var(--accent); }
.page .pd-name { font-size: 34px; }
.page .pd-head .ava { width: 56px !important; height: 56px !important; font-size: 22px !important; }

.empty { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 90px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--ink-3); font-size: 14px; }
.empty .ring { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--bg-sunk); color: var(--ink-4); }
.soon { padding: 40px 0; color: var(--ink-4); font-size: 13.5px; }

::view-transition-old(root), ::view-transition-new(root) { animation-duration: 220ms; animation-timing-function: cubic-bezier(.25,1,.5,1); }
::view-transition-group(*) { animation-duration: 280ms; animation-timing-function: cubic-bezier(.25,1,.5,1); }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand" id="brand"></div>
  <nav class="links" id="links"></nav>
  <div class="tools"><span class="stamp" id="stamp"></span><span id="theme"></span></div>
</div></header>
<main class="col" id="main"></main>
<script>
const G = window.GC;
const { icon, fmt, ranking, WINDOWS, CATS, meta, favBtn, split, vtName, P } = G;
const S = { page: 'rank', win: 'd1', cat: null, state: 'normal', open: null };
const winLabel = () => WINDOWS.find(([k]) => k === S.win)[1];
const rankColor = (r) => `var(--rank-${r <= 3 ? r : 'rest'})`;

document.getElementById('brand').innerHTML = G.logo(22) + 'GitHub 快速中心';
document.getElementById('theme').innerHTML = G.themeSwitch();
document.getElementById('stamp').innerHTML = `统计日 ${meta.statDay}<br>更新于 ${meta.updatedAt}`;

function links() {
  const items = [['rank', '涨星榜'], ['other', '其他榜单'], ['daily', '日报'], ['favs', '我的收藏']];
  document.getElementById('links').innerHTML = items.map(([k, l]) => `<a href="#" data-page="${k}" class="${S.page === k || (k === 'rank' && S.page === 'project') ? 'on' : ''}">${l}${k === 'favs' ? `<span class="count">${G.favs.size}</span>` : ''}</a>`).join('');
}

function rankPage() {
  return `<section class="hero">
      <div class="eyebrow">Rising · 官方核数</div>
      <h1><span class="w" id="hw">${winLabel()}，</span><em>涨星最快的 20 个项目。</em></h1>
      <p>从 <span class="mono">${fmt(meta.candidates)}</span> 个候选里，逐个按 GitHub 官方 Star 历史核出新增数，取前 20，末位并列一起列出。统计日 <span class="num">${meta.statLabel}</span>，每天更新一次。</p>
    </section>
    <div class="controls">${G.seg(WINDOWS, S.win, 'win')}</div>
    <div class="cats">${[[null, '全部'], ...CATS.map((c) => [c, c])].map(([k, l]) => `<button class="chip${S.cat === k ? ' on' : ''}" data-cat="${k ?? ''}">${l}</button>`).join('')}</div>
    <div class="notice-slot" id="notice"></div>
    <div id="catNote"></div>
    <div class="thead"><span>No.</span><span>项目</span><span class="r">分类</span><span class="r" id="gHead">${winLabel()}新增</span><span class="r">总 Star</span><span></span></div>
    <div id="list"></div>
    <p class="foot-note">数字均来自 GitHub 官方 Star 历史；统计日按 UTC 划分。</p>`;
}

const rowHtml = (r) => { const [o, n] = split(r.repo); return `<div class="row" data-key="${r.repo}" data-open="${r.repo}">
  <span class="rk" style="color:${rankColor(r.rank)}">${String(r.rank).padStart(2, '0')}</span>
  <div class="nm"><b><span style="view-transition-name:${vtName(r.repo)}"><i>${o} / </i>${n}</span>${r.tie ? '<span class="tag tie">并列</span>' : ''}</b><p>${r.what}</p></div>
  <div class="cs">${r.cats.map((c) => `<span class="tag">${c}</span>`).join('')}</div>
  <span class="g">+${fmt(r.gain)}</span><span class="t">${fmt(r.total)}</span>${favBtn(r.repo)}
</div>`; };

// 换窗口或分类：同一项目平滑移到新名次，新进的淡入。
function list(animate) {
  const el = document.getElementById('list');
  document.getElementById('notice').innerHTML = G.NOTICE[S.state] || '';
  if (S.state === 'loading') { el.innerHTML = Array.from({ length: 6 }, () => `<div class="sk"><span class="skeleton" style="width:28px"></span><span class="skeleton" style="width:42%"></span><span class="skeleton" style="width:10%;margin-left:auto"></span></div>`).join(''); return; }
  const rows = ranking(S.win, S.cat);
  document.getElementById('catNote').innerHTML = S.cat && rows.length < 20 ? `<p class="cat-note">「${S.cat}」在${winLabel()}核出的结果里有 ${rows.length} 个项目，全部列出。</p>` : '';
  const before = new Map([...el.children].map((c) => [c.dataset.key, c.getBoundingClientRect().top]));
  el.innerHTML = rows.length ? rows.map(rowHtml).join('') : `<p class="soon">这个分类今天没有项目进入核数结果。</p>`;
  if (!animate || G.reduced()) return;
  const ease = 'cubic-bezier(.25,1,.5,1)';
  [...el.children].forEach((c, i) => {
    const prev = before.get(c.dataset.key);
    if (prev == null) { c.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 240, delay: 140 + i * 14, easing: ease, fill: 'backwards' }); return; }
    const dy = prev - c.getBoundingClientRect().top;
    if (dy) c.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 280, easing: ease });
    c.querySelector('.g').animate([{ opacity: .25 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' });
  });
}

function favPage() {
  const keys = [...G.favs];
  if (!keys.length) return `<section class="hero"><h1>我的收藏</h1></section><div class="empty" style="margin-top:36px"><span class="ring">${icon('bookmark')}</span>还没有收藏<button class="btn" data-page="rank">去看涨星榜${icon('arrow')}</button></div>`;
  return `<section class="hero"><div class="eyebrow">Saved</div><h1>我的收藏</h1><p>项目和单个 Skill 都在这里，只有你自己看得到。</p></section>
    <div class="thead" style="margin-top:36px;grid-template-columns:minmax(0,1fr) 120px 30px"><span>项目 / Skill</span><span class="r">收藏于</span><span></span></div>
    ${keys.map((k) => { const [repo, skill] = k.split('#'); return `<div class="row" style="grid-template-columns:minmax(0,1fr) 120px 30px" data-open="${repo}"><div class="nm"><b><span>${skill ? `<i>${repo} · </i>${skill}` : repo}</span><span class="tag">${skill ? 'Skill' : '项目'}</span></b><p>${skill ? P[repo].skills.find((s) => s.name === skill).desc : P[repo].what}</p></div><span class="t">10-23 09:12</span>${favBtn(k)}</div>`; }).join('')}`;
}

function render() {
  links();
  const m = document.getElementById('main');
  if (S.page === 'rank') { m.innerHTML = rankPage(); list(false); }
  else if (S.page === 'project') m.innerHTML = `<div class="page"><a href="#" class="back" data-page="rank">${icon('back')}返回涨星榜</a>${G.detail(S.open, { win: S.win, state: S.state })}</div>`;
  else if (S.page === 'favs') m.innerHTML = favPage();
  else m.innerHTML = `<section class="hero"><h1>${S.page === 'other' ? '其他榜单' : '日报'}</h1></section><p class="soon">候选阶段只演示涨星榜、项目页和收藏；选定方向后在高保真阶段补齐这一页。</p>`;
}

// 进出项目页：项目名从列表行移到页头（共享元素过渡）。
function go(page, repo) {
  const y = page === 'rank' && S.page === 'project' ? S.scrollY : 0;
  if (page === 'project') S.scrollY = scrollY;
  S.page = page; if (repo) S.open = repo;
  G.transition(() => { render(); scrollTo(0, y); });
}
G.bindDetail(document.getElementById('main'));

document.addEventListener('click', (e) => {
  const p = e.target.closest('[data-page]');
  if (p) { e.preventDefault(); go(p.dataset.page); return; }
  const w = e.target.closest('[data-win]');
  if (w) {
    S.win = w.dataset.win;
    G.setSeg(w.closest('.seg'), 'win', S.win);
    const hw = document.getElementById('hw');
    hw.textContent = winLabel() + '，';
    hw.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 240, easing: 'cubic-bezier(.25,1,.5,1)' });
    document.getElementById('gHead').textContent = winLabel() + '新增';
    list(true);
    return;
  }
  const c = e.target.closest('[data-cat]');
  if (c) { S.cat = c.dataset.cat || null; document.querySelectorAll('[data-cat]').forEach((x) => x.classList.toggle('on', x === c)); list(true); return; }
  const o = e.target.closest('[data-open]');
  if (o && !e.target.closest('.pd')) go('project', o.dataset.open);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.page === 'project') go('rank'); });
document.addEventListener('gc:fav', () => { links(); if (S.page === 'favs') document.getElementById('main').innerHTML = favPage(); });
G.demoPanel((st) => { S.state = st; if (S.page === 'rank') list(false); else render(); });
// 评审用网址参数：?win=d7&state=failed&open=owner/repo
const Q = new URLSearchParams(location.search);
if (Q.get('win')) S.win = Q.get('win');
if (Q.get('state')) S.state = Q.get('state');
if (Q.get('open')) { S.page = 'project'; S.open = Q.get('open'); }
render();
</script>
</body>
</html>
