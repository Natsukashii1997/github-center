<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>其他榜单 · 版二 长表带走势 · GitHub 快速中心</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<header class="top"></header>
<div class="single-wide">
  <div class="phead"><h1>其他榜单</h1><p class="lede" id="lede"></p></div>
  <div id="boards" role="group" aria-label="榜单" style="--tab-w:112px"></div>
  <div class="sub"><div id="period" role="group" aria-label="热门榜周期"></div><span id="subtext"></span></div>
  <div id="cats" role="group" aria-label="分类"></div>
  <div id="notes"></div>
  <ol class="lrows" id="rows"></ol>
  <p class="foot">所有数字来自 GitHub 官方数据；每行中间是该项目近 30 天每日新增的走势。</p>
</div>

<script src="icons.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
<script>
// 版二「长表带走势」：一次看一个榜，整行铺开，中间是近 30 天走势，右边是本榜的数字；换榜时行从旧位置滑到新位置。
(() => {
  const { $, $$, esc, num, wan, I } = GC;
  const { P, spark, avImg, name, ds, cats, favBtn, wireFavs, wireOpen, project } = GP;
  const BOARDS = [['new', '新项目榜'], ['trending', '官方热门榜'], ['top', '累计高星榜']];
  const PER = [['daily', '日榜', '今日', 'd1'], ['weekly', '周榜', '本周', 'd7'], ['monthly', '月榜', '本月', 'd30']];
  let board = GC.q.get('board') || 'new', period = 'daily', cat = null;
  const rowsEl = $('#rows');
  GC.topbar('其他榜单');
  $('#lede').innerHTML = `统计日 ${GC.md(GC.dayAt(29))}（UTC）。每个榜前 20 名，末位并列一起列出。`;
  const placeBoard = GC.tabs($('#boards'), BOARDS, board, (id) => { if (id !== board) { board = id; render(); } });
  GC.seg($('#period'), PER.map(([id, t]) => [id, t]), period, (id) => { period = id; render(); }, 64);
  const placeCat = GC.chips($('#cats'), cat, (c) => { if (c !== cat) { cat = c; render(); } });

  function build() {
    const B = GC.D.boards;
    if (board === 'new') return { rows: B.new, sub: '近 30 天内创建的项目，按总 Star 排。', win: null, g: (r) => num(r.total), t: (r) => `创建于 <span class="num">${GC.mdShort(GC.iso(r.created))}</span>` };
    if (board === 'trending') { const [, , word, win] = PER.find((x) => x[0] === period); return { rows: B.trending[period], sub: 'Trending 原样排序，数字为官方页面标注。', win, g: (r) => `<span class="g-k">${word}</span><small>+</small>${num(r.gain)}`, t: (r) => `总 <span class="num">${wan(r.total)}</span>` }; }
    return { rows: B.top, sub: '全站按总 Star 排。', win: 'd30', g: (r) => num(r.total), t: (r) => { const d = GC.gainOf(P(r.repo), 'd30'); return `近 30 天 <span class="num">${d == null ? '暂缺' : `+${num(d)}`}</span>`; } };
  }
  function create(r) {
    const li = document.createElement('li');
    li.className = 'lrow';
    li.dataset.href = project(r.repo, 'boards');
    li.addEventListener('click', (e) => { if (e.target.closest('button, a')) return; location.href = li.dataset.href; });
    return li;
  }
  function update(li, r, i, cur) {
    const p = P(r.repo), rank = cat ? i + 1 : r.rank;
    li.toggleAttribute('data-top', rank <= 3);
    li.innerHTML = `<div class="rk"><b>${rank}</b></div>${avImg(p, 56)}<div class="tx"><div class="nm" title="${esc(p.repo)}">${name(p)}</div><div class="ds" title="${esc(ds(p))}">${esc(ds(p))}</div><div class="tg">${cats(p)}</div></div><div>${spark(p, cur.win ? GC.SPAN[cur.win] : 0)}</div><div class="nums"><div class="g">${cur.g(r)}</div><div class="t">${cur.t(r)}</div></div>${favBtn(p)}`;
    wireFavs(li);
  }
  function render() {
    placeBoard(board); placeCat(cat);
    const cur = build();
    const rows = cur.rows.filter((r) => !cat || P(r.repo).cats.includes(cat));
    $('#period').hidden = board !== 'trending';
    GC.swap($('#subtext'), cur.sub);
    const short = cat && rows.length && rows.length < 20 ? `<div class="note">${I.tag}<b>不足 20 个</b><p>「${esc(cat)}」在本榜只有 ${rows.length} 个项目，全部列出。</p></div>` : '';
    $('#notes').innerHTML = short;
    GC.reconcile(rowsEl, rows, { key: (r) => r.repo, create, update: (li, r, i) => update(li, r, i, cur) });
    if (!rows.length) rowsEl.innerHTML = GC.emptyHTML('inbox', '这个分类在本榜没有项目', '换个分类看看。');
  }
  render();
})();
</script>
</body>
</html>
