<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日报 · 版二 信纸单栏 · GitHub 快速中心</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<header class="top"></header>
<main class="letter" id="page"></main>

<script src="icons.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="pages.js"></script>
<script>
// 版二「信纸单栏」：一封信的样子，从头读到尾；每个窗口是一段带编号的清单，名字、新增和一句话连成一行，不配头像和图。
(() => {
  const { $, esc, num, wan } = GC;
  const { P, dailySections, name, cats, project } = GP;
  GC.topbar('日报');
  const day = GC.md(GC.dayAt(29));
  const sections = dailySections();
  const item = ({ r, first }) => {
    const p = P(r.repo);
    const tail = first ? `<span class="seeup">见上：<a href="#${first.id}">${first.label}</a></span>` : `${esc(p.what ?? '简介生成中')}${p.problem ? ` ${esc(p.problem)}` : ''}<span class="micro">${p.cats.join(' · ')}${p.cats.length ? ' · ' : ''}总 Star ${p.total == null ? '暂缺' : wan(p.total)}</span>`;
    return `<li id="${first ? '' : ''}"><a href="${project(r.repo, 'daily')}">${name(p)}</a><span class="g">+${num(r.gain)}</span>${first ? '' : '　'}${tail}</li>`;
  };
  $('#page').innerHTML = `<h1>${day}日报</h1><p class="lede">统计日 ${day}（UTC），10 月 23 日 16:52 生成。飞书里收到的就是这一份。</p>
    <h2>概览</h2><p>${esc(GC.D.daily.overview)}</p>
    ${sections.map(({ w, items }) => `<h2 id="${w.id}">${w.label}前 10</h2><ol>${items.map((it) => item(it).replace('<li id="">', `<li id="${it.id}">`)).join('')}</ol>`).join('')}
    <h2>版本发布</h2><p class="lede">榜上项目在统计日前 7 天内发布的版本，每个项目取最近一次。只写有记录的事，不猜为什么涨。</p>${GC.D.daily.releases.map((r) => GP.relRow(r, 'daily')).join('')}
    <p class="foot">数字来自 GitHub 官方数据；项目介绍由 AI 根据项目文档写成。</p>`;
  GC.anim($('#page'), [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 240 });
})();
</script>
</body>
</html>
